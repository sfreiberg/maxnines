[package]
name = "maxnines-checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
flate2 = "1"
hickory-proto = { version = "0.25", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
maxnines-protocol.workspace = true
regex-lite = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt", "net", "process", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
rcgen = "0.14"
