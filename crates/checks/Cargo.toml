[package]
name = "maxnines-checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# A UniFi console of its own, for tests here and in the server.
rcgen = { version = "0.14", optional = true }
anyhow.workspace = true
futures-util.workspace = true
chrono.workspace = true
base64 = "0.22"
flate2 = "1"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The columns a template's MongoDB query names, in order, as the protocol sends them.
indexmap = "2.14.2"
maxnines-protocol.workspace = true
# Spreading out when reads start, as the agent already does with the same version.
rand = "0.10"
regex-lite = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt", "net", "process", "sync", "time"] }
tracing.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The path a certificate was checked along, which rustls doesn't give. Already used
# by rustls, so nothing new is built.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
# Picks the metrics to keep from an OpenMetrics page, with the same wildcards the
# server's alert rules use.
wildmatch = "2.7.0"
x509-parser = { version = "0.18", default-features = false }
# Signing in to databases and SSH servers, each with only what a check needs and
# with TLS through the rustls and ring already here. What each adds to the agent
# was measured before choosing them.
mysql_async = { version = "0.36.2", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
redis = { version = "1.8.2", default-features = false, features = ["tokio-rustls-comp"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.13"
# MongoDB's own driver, without SRV lookups or the old BSON, as a check gives
# one server's address.
mongodb = { version = "3.10.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls"] }
# Signing in to mail servers. SMTP's client library makes its own connections and
# TLS, so it can't time them or read the certificate, and POP3's only library can't
# upgrade to TLS with STLS, so both are spoken here instead.
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
# The packets of LDAP (BER, from the ldap3 client's own library) and MQTT 3.1.1 (from
# the rumqttc client, without its TLS), spoken over the check's own connection, as
# the clients make their own, which couldn't be timed or have their certificate read.
bytes = "1"
lber = "0.5.1"
rumqttc = { version = "0.25.1", default-features = false }

# Pinging with Windows' own ICMP functions, which any account may use.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }

[features]
fake-unifi = ["dep:rcgen"]

[dev-dependencies]
rcgen = "0.14"
