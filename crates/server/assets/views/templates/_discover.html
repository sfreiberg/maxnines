<div class="repeat">
  {% set e = errors | get(key=d, default="") %}{% if e %}<p class="field-error">{{ e }}</p>{% endif %}
  <label>Key
    <input type="text" name="{{ d }}key" value="{{ discover.key }}"{% if part_only %} readonly{% endif %} spellcheck="false" autocomplete="off" placeholder="role">
    {% set e = errors | get(key=d ~ "key", default="") %}{% if e %}<small class="field-error">{{ e }}</small>{% endif %}
  </label>
  <label>Every
    <input type="text" name="{{ d }}interval" value="{{ discover.interval }}" spellcheck="false" placeholder="1h">
    {% set e = errors | get(key=d ~ "interval", default="") %}{% if e %}<small class="field-error">{{ e }}</small>{% endif %}
  </label>
  <label>SQL
    <textarea name="{{ d }}sql" rows="4" spellcheck="false">{{ discover.sql }}</textarea>
    <small>Each column becomes something <code>when</code> can look at by its name. A <code>version</code> column is read as a version.</small>
    {% set e = errors | get(key=d ~ "sql", default="") %}{% if e %}<small class="field-error">{{ e }}</small>{% endif %}
  </label>
  <label>Counter sets
    <textarea name="{{ d }}counter_sets" rows="2" spellcheck="false" placeholder="asp_net = ASP.NET">{{ discover.counter_sets }}</textarea>
    <small>One <code>name = Counter set</code> to a line, each true or false for whether the host has it.</small>
    {% set e = errors | get(key=d ~ "counter_sets", default="") %}{% if e %}<small class="field-error">{{ e }}</small>{% endif %}
  </label>
  {% for read in discover.registry %}
  {% set p = d ~ "registry." ~ loop.index0 ~ "." %}
  <div class="repeat">
    <label>Registry key
      <input type="text" name="{{ p }}key" value="{{ read.key }}" spellcheck="false" placeholder="HKLM\SOFTWARE\Microsoft\InetStp">
    </label>
    <label>Values
      <textarea name="{{ p }}values" rows="2" spellcheck="false" placeholder="version = VersionString">{{ read.values }}</textarea>
      <small>One <code>name = Value name</code> to a line.</small>
    </label>
    <button type="submit" name="form_action" value="remove:discover.{{ di }}.registry.{{ loop.index0 }}" class="secondary" formnovalidate hx-post="{{ action }}" hx-target="#template-form" hx-select="#template-form" hx-swap="morph:outerHTML">Remove registry key</button>
  </div>
  {% endfor %}
  {% set e = errors | get(key=d ~ "registry", default="") %}{% if e %}<small class="field-error">{{ e }}</small>{% endif %}
  <div class="actions">
    <button type="submit" name="form_action" value="add:discover.{{ di }}.registry" class="secondary" formnovalidate hx-post="{{ action }}" hx-target="#template-form" hx-select="#template-form" hx-swap="morph:outerHTML">Add registry key</button>
    {% if not part_only %}<button type="submit" name="form_action" value="remove:discover.{{ di }}" class="secondary" formnovalidate hx-post="{{ action }}" hx-target="#template-form" hx-select="#template-form" hx-swap="morph:outerHTML">Remove discover block</button>{% endif %}
  </div>
</div>
