<form id="host-filter" class="host-filter" method="get" action="{{ search_path }}" role="search">
  {% if keep_tab %}<input type="hidden" name="status" value="{{ keep_tab }}">{% endif %}
  {% if as_table %}<input type="hidden" name="view" value="table">{% endif %}
  <div class="host-filter-box">
    <input type="text" name="filter" value="{{ search.text }}" aria-label="Filter machines" placeholder="os=linux hostname=web*" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="host-filter-options">
    <ul id="host-filter-options" role="listbox" aria-label="Suggestions" hidden></ul>
  </div>
  <button type="submit">Filter</button>
  {% if search.text %}<a class="button secondary" href="{{ search_path }}">Clear</a>{% endif %}
</form>
{% if search.error %}<p class="error">{{ search.error }}</p>{% endif %}
