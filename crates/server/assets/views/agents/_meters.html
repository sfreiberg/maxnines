<span class="meters">
  <span>CPU</span>
  <svg class="meter" aria-hidden="true"><rect class="track" width="100%" height="7" rx="3.5"/>{% if agent.cpu %}<rect class="fill" width="{{ agent.cpu.width }}%" height="7" rx="3.5"/>{% endif %}</svg>
  <span class="value">{% if agent.cpu %}{{ agent.cpu.text }}{% else %}–{% endif %}</span>
  <span>Memory</span>
  <svg class="meter" aria-hidden="true"><rect class="track" width="100%" height="7" rx="3.5"/>{% if agent.memory %}<rect class="fill" width="{{ agent.memory.width }}%" height="7" rx="3.5"/>{% endif %}</svg>
  <span class="value">{% if agent.memory %}{{ agent.memory.text }}{% else %}–{% endif %}</span>
  <span>Disk</span>
  <svg class="meter" aria-hidden="true"><rect class="track" width="100%" height="7" rx="3.5"/>{% if agent.disk %}<rect class="fill{% if agent.disk_is_full %} hot{% endif %}" width="{{ agent.disk.width }}%" height="7" rx="3.5"/>{% endif %}</svg>
  <span class="value">{% if agent.disk %}{{ agent.disk.text }}{% else %}–{% endif %}</span>
</span>
