  <section class="chart-card">
    <div class="chart-heading">
      <h2>{{ chart.title }}</h2>
      {% if chart.has_data %}<a href="/hosts/{{ host_id }}/metrics/{{ chart.name }}?range={{ range }}">View data</a>{% endif %}
    </div>
    {% include "metrics/_chart_body.html" %}
    {% if chart.name == "system.failed_services" and failed_services %}{% set compact = true %}{% include "metrics/_failed_services.html" %}{% endif %}
  </section>
