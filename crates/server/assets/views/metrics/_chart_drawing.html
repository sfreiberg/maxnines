    <svg class="chart" data-reach="{{ chart.reach_ms }}" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ chart.title }} over time. The table below gives the numbers.">
      {% for tick in chart.y_ticks %}
      <line class="grid" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ tick.position }}" y2="{{ tick.position }}"/>
      <text class="tick" x="{{ chart.left - 6 }}" y="{{ tick.position + 4 }}" text-anchor="end">{{ tick.label }}</text>
      {% endfor %}
      {% for tick in chart.x_ticks %}
      <text class="tick" x="{{ tick.position }}" y="{{ chart.bottom + 18 }}" text-anchor="middle">{{ tick.label }}</text>
      {% endfor %}
      {% for marker in chart.markers %}<line class="event-line k-{{ marker.kind }}" x1="{{ marker.x }}" x2="{{ marker.x }}" y1="{{ chart.top }}" y2="{{ chart.bottom }}"/>{% endfor %}
      {% for line in chart.lines %}
      {% for band in line.bands %}<polygon class="band s{{ line.slot }}" points="{{ band }}"/>{% endfor %}
      {% for whisker in line.whiskers %}<line class="whisker s{{ line.slot }}" x1="{{ whisker.x }}" x2="{{ whisker.x }}" y1="{{ whisker.top }}" y2="{{ whisker.bottom }}"/>{% endfor %}
      {% endfor %}
      {% for line in chart.lines %}
      {% for segment in line.segments %}<polyline class="line s{{ line.slot }}" points="{{ segment }}"/>{% endfor %}
      {% for dot in line.dots %}<circle class="dot s{{ line.slot }}" cx="{{ dot.x }}" cy="{{ dot.y }}" r="2.5"/>{% endfor %}
      {% endfor %}
      {% for column in chart.columns %}
      <g class="column" data-time="{{ column.time_ms }}">
        <rect class="hit" x="{{ column.hit_x }}" y="{{ chart.top }}" width="{{ column.hit_width }}" height="{{ chart.bottom - chart.top }}"/>
        <g class="reading">
          <line class="crosshair" x1="{{ column.x }}" x2="{{ column.x }}" y1="{{ chart.top }}" y2="{{ chart.bottom }}"/>
          {% for row in column.rows %}<circle class="marker s{{ row.slot }}" cx="{{ row.dot.x }}" cy="{{ row.dot.y }}" r="4"/>{% endfor %}
          <rect class="tooltip" x="{{ column.tooltip_x }}" y="{{ chart.top }}" width="{{ column.tooltip_width }}" height="{{ column.tooltip_height }}" rx="4"/>
          <text class="tooltip-time" x="{{ column.tooltip_x + 8 }}" y="{{ chart.top + 15 }}">{{ column.time }}</text>
          {% for row in column.rows %}
          <line class="key s{{ row.slot }}" x1="{{ column.tooltip_x + 8 }}" x2="{{ column.tooltip_x + 18 }}" y1="{{ row.text_y - 4 }}" y2="{{ row.text_y - 4 }}"/>
          <text class="tooltip-row" x="{{ column.tooltip_x + 22 }}" y="{{ row.text_y }}"><tspan class="tooltip-value">{{ row.value }}</tspan> {{ row.name }}</text>
          {% endfor %}
        </g>
      </g>
      {% endfor %}
      {% for marker in chart.markers %}
      <g class="event">
        <rect class="hit" x="{{ marker.hit_x }}" y="{{ chart.top }}" width="{{ marker.hit_width }}" height="{{ chart.bottom - chart.top }}"/>
        <circle class="event-dot k-{{ marker.kind }}" cx="{{ marker.x }}" cy="{{ chart.top + 4 }}" r="4"/>
        <g class="event-tip">
          <rect class="tooltip" x="{{ marker.tooltip_x }}" y="{{ chart.top }}" width="{{ marker.tooltip_width }}" height="42" rx="4"/>
          <text class="tooltip-time" x="{{ marker.tooltip_x + 8 }}" y="{{ chart.top + 15 }}">{{ marker.time }}</text>
          <text class="tooltip-row" x="{{ marker.tooltip_x + 8 }}" y="{{ chart.top + 30 }}"><tspan class="tooltip-value">{{ marker.kind_label }}</tspan> {{ marker.title }}</text>
        </g>
      </g>
      {% endfor %}
    </svg>
