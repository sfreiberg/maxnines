[package]
name = "maxnines-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Stay on DuckDB 1.5: 1.20000.x bundles a pre-release 2.0 with a development
# storage format. Tilde because a minor bump changes the bundled DuckDB.
duckdb = { version = "~1.10506.1", features = ["bundled", "json"] }
hcl-rs.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
ipnet = "2.12.2"
maxnines-checks.workspace = true
maxnines-protocol.workspace = true
ring.workspace = true
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
wildmatch = "2.7.0"
cel = "0.15"
tera = "2.4"
axum_csrf = "0.12"
rust-embed = { version = "8.13", features = ["mime-guess"] }

[dev-dependencies]
futures-util.workspace = true
tempfile = "3"
tokio-tungstenite.workspace = true

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build"] }
