[package]
name = "maxnines-collectors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
sysinfo = "0.40.1"
systemstat = "0.2.7"
tokio = { version = "1.54.1", features = ["process", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

# For telling disk images from disks, and how busy disks are. Already used by sysinfo,
# so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }

# For GetSystemTimes, performance counters and network interfaces and connections.
# Already used by sysinfo, so nothing new is built.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Performance", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
sysctl = "0.7"
# For each network interface's counters. Already used by sysinfo, so nothing new is built.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
