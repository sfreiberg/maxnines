[package]
name = "maxnines-collectors"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# What the tests of collectors' entries share, for the crates that have such tests.
testing = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
maxnines-protocol.workspace = true
# For templates' patterns over counter sets' instances, as the protocol reads them.
regex-lite = "0.1"
serde_json.workspace = true
sysinfo = "0.40.1"
systemstat = "0.2.7"
tokio = { version = "1.54.1", features = ["process", "rt", "time"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
# For each network interface's counters on macOS and FreeBSD, and the kernel's clock
# sync everywhere. Already used by sysinfo and tokio, so nothing new is built.
libc = "0.2"

# For telling disk images from disks, and how busy disks and GPUs are. Already used by
# sysinfo, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }

# For GetSystemTimes, performance counters, network interfaces and connections,
# services, and whether a restart is waiting.
# Already used by sysinfo, so nothing new is built.
[target.'cfg(windows)'.dependencies]
# For templates' registry values, as the agent reads the services installed.
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
sysctl = "0.7"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
