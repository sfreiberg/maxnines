[package]
name = "maxnines-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "signal", "sync"] }
regex-lite = "0.1"
anyhow.workspace = true
chrono.workspace = true
hcl-rs.workspace = true
hex.workspace = true
# Templates' lengths of time, such as "5m", and their maps in the order written.
humantime = "2.3"
indexmap = { version = "2.14.2", features = ["serde"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
clap.workspace = true
windows-service = "0.8"
# Saves settings where the installers find them for Modify.
windows-registry = "0.6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
