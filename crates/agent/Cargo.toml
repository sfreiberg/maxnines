[package]
name = "maxnines-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
hcl-rs.workspace = true
maxnines-checks.workspace = true
maxnines-collectors.workspace = true
maxnines-protocol.workspace = true
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["io-util", "rt", "macros", "process", "time", "signal", "sync"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build"] }
