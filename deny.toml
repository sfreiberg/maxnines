[advisories]
ignore = [
    # chrono and chrono-tz are unmaintained. jiff would replace both, but
    # sqlx, sea-orm, DuckDB, ClickHouse, arrow, cel, rustls-acme and async-imap
    # all use chrono themselves, and none of the database libraries can read or
    # write jiff types yet. Revisit once sqlx and sea-orm support jiff.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no replacement our database libraries support yet" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained; goes with chrono" },
]

# Licenses a dependency may use, as MaxNines is MIT licensed and shipped as
# binaries. Each is permissive; anything else fails the check until it's looked
# at. Where a crate offers a choice, one of these is enough.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # webpki-roots: Mozilla's list of certificate authorities.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The workspace's own crates aren't published, so their license isn't checked here.
[licenses.private]
ignore = true
