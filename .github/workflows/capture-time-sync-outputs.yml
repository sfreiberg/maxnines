# Captures what each kernel, and the Windows Time Service's counters, say about the
# clock's sync, with the time service running, stopped and started again, so the
# agent's time_sync collector is tested against what they really say. It runs by
# hand from the Actions tab, and by itself only when this file or its scripts
# change, never for other pushes, so CI is no slower. Download its artifacts into
# crates/collectors/fixtures/time_sync/.
name: Capture time sync outputs

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture-time-sync-outputs.yml
      - crates/collectors/fixtures/time_sync/capture-*
      - crates/collectors/fixtures/time_sync/read.c

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v5
      - run: sudo sh crates/collectors/fixtures/time_sync/capture-unix.sh
      - uses: actions/upload-artifact@v7
        with:
          name: time-sync-${{ matrix.runner }}
          path: out/

  # GitHub has no FreeBSD runners, so this runs in a FreeBSD virtual machine.
  freebsd:
    name: FreeBSD ${{ matrix.release }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ["14.3", "15.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          copyback: true
          run: sh crates/collectors/fixtures/time_sync/capture-unix.sh
      - uses: actions/upload-artifact@v7
        with:
          name: time-sync-freebsd-${{ matrix.release }}
          path: out/

  windows:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - shell: powershell
        run: .\crates\collectors\fixtures\time_sync\capture-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: time-sync-${{ matrix.runner }}
          path: out/

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo sh crates/collectors/fixtures/time_sync/capture-unix.sh
      - uses: actions/upload-artifact@v7
        with:
          name: time-sync-macos
          path: out/
