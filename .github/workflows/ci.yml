# Checks formatting, runs clippy and runs the tests, on each system the agent and
# server are built for. Much of the agent only compiles on one system, so each
# gets its own clippy and tests.
#
# Pull requests and pushes to main run only the unit tests, which take seconds;
# .config/nextest.toml says which tests those are. The whole suite, integration
# tests included, runs when the release workflow calls this for a tagged commit,
# which publishes nothing unless it passes, and when it's run by hand from the
# Actions tab, which runs the whole suite unless told not to.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      all-tests:
        description: Run the integration tests too, not just the unit tests
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      all-tests:
        description: Run the integration tests too, not just the unit tests
        type: boolean
        default: true

permissions:
  contents: read

# A newer commit on the same branch or pull request replaces a run still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Clippy and tests on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04 }
          - { name: macOS, runner: macos-15 }
          - { name: Windows, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The build goes where .cargo/config.toml says, not ./target. A run whose
      # tests fail still saves what it built, which is the slow part.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target.nosync"
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every crate's tests run, so one run shows every failure. A pull request or
      # push runs no inputs, so it gets the unit tests alone.
      - if: ${{ !inputs.all-tests }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Unit tests
        if: ${{ !inputs.all-tests }}
        run: cargo nextest run --workspace --locked --profile unit
      - name: All tests
        if: ${{ inputs.all-tests }}
        run: cargo test --workspace --locked --no-fail-fast
      # Windows only runs a program whose DLLs it can find. These are on every
      # Windows machine, so anything else, such as the Visual C++ runtime, means the
      # programs won't start where it isn't installed.
      - name: Check the Windows programs need nothing installed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked -p maxnines-agent -p maxnines-server
          packaging/check-windows-dlls.sh target.nosync/debug/maxnines-agent.exe target.nosync/debug/maxnines-server.exe
