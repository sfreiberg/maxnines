# Checks formatting, runs clippy and runs every test, on each system the agent
# and server are built for. Much of the agent only compiles on one system, so each
# gets its own clippy and tests. The release workflow runs this too, before it
# builds anything.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# When the release workflow runs this, github.workflow is "Release", so the two
# don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    # A pull request from a branch here is already covered by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Clippy and tests on ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04 }
          - { name: macOS, runner: macos-15 }
          - { name: Windows, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every crate's tests run, so one run shows every failure.
      - run: cargo test --workspace --locked --no-fail-fast
