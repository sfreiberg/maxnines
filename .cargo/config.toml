# This project lives in iCloud Drive, which skips names ending in .nosync.
# Building here keeps large build output from being synced.
[build]
target-dir = "target.nosync"

# Windows binaries carry the C runtime inside them, so they run on any Windows
# machine. Linked the usual way, they need the Visual C++ Redistributable, and
# without it Windows stops them before they start, with no message over SSH.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
